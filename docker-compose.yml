services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [shortener-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: ./app
    environment:
      REDIS_HOST: redis
      BASE_URL: http://localhost   # change to your server's hostname/IP
    depends_on:
      redis:
        condition: service_healthy
    networks: [shortener-net]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on: [app]
    networks: [shortener-net]
    restart: unless-stopped

networks:
  shortener-net:
    driver: bridge

volumes:
  redis-data:
